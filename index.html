<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#228B22" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa-icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-TileColor" content="#228B22" />

    <title>EcoSwarm - Your Digital Agora</title>
    <meta
      name="description"
      content="Join EcoSwarm - Kenya's planet-positive social activism platform. Share stories, join swarms, send advocacy letters, and make your voice heard on environmental issues."
    />
    <meta name="author" content="EcoSwarm" />
    <meta
      name="keywords"
      content="climate activism, Kenya, Gen Z, environment, Nairobi, social activism, advocacy, sustainability"
    />

    <meta property="og:title" content="EcoSwarm - Your Digital Agora" />
    <meta
      property="og:description"
      content="Join Kenya's planet-positive social activism platform. Share stories, join swarms, and make your voice heard."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://ecoswarm.app" />
    <meta property="og:site_name" content="EcoSwarm" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@EcoSwarm" />
    <meta name="twitter:title" content="EcoSwarm - Your Digital Agora" />
    <meta
      name="twitter:description"
      content="Join Kenya's planet-positive social activism platform. Share stories, join swarms, and make your voice heard."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="canonical" href="https://ecoswarm.app" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Preconnect to external origins for faster resource loading -->
    <link rel="preconnect" href="https://cdn.gpteng.co" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.gpteng.co" />
  </head>

  <body>
    <div id="root">
      <!-- Branded splash screen shown before React hydrates -->
      <div id="app-splash" style="
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(145deg, #0f1f0f 0%, #1a3a1a 50%, #0f1f0f 100%);
        font-family: system-ui, -apple-system, sans-serif;
        gap: 24px;
      ">
        <img src="/pwa-icon-192.png" alt="EcoSwarm" width="80" height="80" style="border-radius: 20px; animation: splash-pulse 1.8s ease-in-out infinite;" />
        <div style="text-align: center;">
          <h1 style="color: #4ade80; font-size: 24px; font-weight: 700; margin: 0 0 6px 0; letter-spacing: -0.5px;">EcoSwarm</h1>
          <p style="color: rgba(255,255,255,0.5); font-size: 13px; margin: 0;">Your Digital Agora</p>
        </div>
        <div style="display: flex; gap: 6px;">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: #228B22; animation: splash-dot 1.2s ease-in-out infinite;"></span>
          <span style="width: 8px; height: 8px; border-radius: 50%; background: #228B22; animation: splash-dot 1.2s ease-in-out 0.2s infinite;"></span>
          <span style="width: 8px; height: 8px; border-radius: 50%; background: #228B22; animation: splash-dot 1.2s ease-in-out 0.4s infinite;"></span>
        </div>
      </div>
      <style>
        @keyframes splash-pulse {
          0%, 100% { transform: scale(1); opacity: 1; }
          50% { transform: scale(1.05); opacity: 0.85; }
        }
        @keyframes splash-dot {
          0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
          40% { opacity: 1; transform: scale(1.2); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
